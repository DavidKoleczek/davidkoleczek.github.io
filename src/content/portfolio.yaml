# ===== Publications =====

- id: pcl-semeval-2022
  date: "2022-07-14"
  dateDisplay: "July 2022"
  categories:
    - Publication
  title: "UMass PCL at SemEval-2022 Task 4: Pre-trained Language Model Ensembles for Detecting Patronizing and Condescending Language"
  authors:
    - David Koleczek
    - Alex Scarlatos
    - Siddha Karakare
    - Preshma Linet Pereira
  venue: The 16th International Workshop on Semantic Evaluation (SemEval-2022)
  description: >-
    Patronizing and condescending language (PCL) is everywhere, but rarely is the focus on its use by media towards vulnerable communities. 
    Accurately detecting PCL of this form is a difficult task due to limited labeled data and how subtle it can be. 
    In this paper, we describe our system for detecting such language which was submitted to 
    SemEval 2022 Task 4: Patronizing and Condescending Language Detection. 
    Our approach uses an ensemble of pre-trained language models, data augmentation, 
    and optimizing the threshold for detection. Experimental results on the evaluation 
    dataset released by the competition hosts show that our work is reliably able to detect PCL, 
    achieving an F1 score of 55.47% on the binary classification task and a macro F1 
    score of 36.25% on the fine-grained, multi-label detection task.
  link: https://arxiv.org/abs/2204.08304

- id: shared-autonomy-aaai
  date: "2022-02-22"
  dateDisplay: "February 2022"
  categories:
    - Publication
  title: "On Optimizing Interventions in Shared Autonomy"
  description: >-
    Shared autonomy refers to approaches for enabling an autonomous agent to collaborate
    with a human with the aim of improving human performance. However, besides improving
    performance, it may often also be beneficial that the agent concurrently accounts for
    preserving the user's experience or satisfaction of collaboration. We propose two
    model-free reinforcement learning methods that can account for both hard and soft
    constraints on the number of interventions. We show that not only does our method
    outperform the existing baseline, but also eliminates the need to manually tune a
    black-box hyperparameter for controlling the level of assistance.
    Code available at: [https://github.com/DavidKoleczek/human_marl](https://github.com/DavidKoleczek/human_marl)
  link: https://ojs.aaai.org/index.php/AAAI/article/view/20471
  authors:
    - Weihao Tan
    - David Koleczek
    - Siddhant Pradhan
    - Nicholas Perello
    - Vivek Chettiar
    - Nan Ma
    - Aaslesha Rajaram
    - Vishal Rohra
    - Soundar Srinivasan
    - H M Sajjad Hossain
    - Yash Chandak
  venue: Thirty-Sixth AAAI Conference on Artificial Intelligence (AAAI 2022)

