- id: eval-recipes
  date: "2025-12-22"
  categories:
    - Featured
    - Open Source
  title: "Microsoft Eval Recipes"
  description: >-
    Eval Recipes is a library dedicated to making it easier to keep up with the 
    state-of-the-art in evaluating AI agents. It currently has two main components: 
    a benchmarking harness for evaluating CLI agents (GitHub Copilot CLI, Claude Code, etc) 
    on real-world tasks via containers and an online evaluation framework for LLM chat assistants. 
    The common thread between these components is the concept of
    [recipes](https://sundaylettersfromsam.substack.com/p/what-is-an-ai-recipe) which are a 
    mix of code and LLM calls to achieve a desired tradeoff between flexibility and quality.
  link: https://github.com/microsoft/eval-recipes/
  image: https://github.com/microsoft/eval-recipes/raw/main/demos/data/EvalRecipesAnimation.gif
  imageAlt: Eval Recipes Online Evaluation Diagram

- id: chat-context-toolkit
  date: "2025-08-01"
  categories:
    - Featured
    - Open Source
  title: "Chat Context Toolkit"
  description: |
    The Chat Context Toolkit is a Python library, currently a part of Microsoft's Semantic Workbench designed to efficiently manage context for most AI agents.
    Read more on [LinkedIn](https://www.linkedin.com/posts/david-koleczek_finally-someone-copied-us-today-anthropic-activity-7378560191925223424-Cb2U).

    The chat context toolkit provides these three core, modular components:

    Message History Management: Applies context engineering techniques to ensure that messages fit within a token budget.

    Archive: A task for archiving and processing chunks of the message history that may no longer fit within a token budget to ensure older data can still be considered.

    Virtual Filesystem: Creates a common abstraction for LLMs to read, edit, and explore files coming from a variety of disparate sources.
  link: https://github.com/microsoft/semanticworkbench/tree/main/libraries/python/chat-context-toolkit
  image: /portfolio/chat_context_toolkit.png
  imageAlt: Chat Context Toolkit Message History Management Diagram

- id: prompt-formatting-paper
  date: "2024-11-14"
  dateDisplay: "November 2024"
  categories:
    - Featured
    - Publication
  title: "Does Prompt Formatting Have Any Impact on LLM Performance?"
  description: >-
    In the realm of Large Language Models (LLMs), prompt optimization is crucial
    for model performance. Although previous research has explored aspects like
    rephrasing prompt contexts, using various prompting techniques (like in-context
    learning and chain-of-thought), and ordering few-shot examples, our understanding
    of LLM sensitivity to prompt templates remains limited. Therefore, this paper
    examines the impact of different prompt templates on LLM performance. We formatted
    the same contexts into various human-readable templates, including plain text,
    Markdown, JSON, and YAML, and evaluated their impact across tasks like natural
    language reasoning, code generation, and translation using OpenAI's GPT models.
    Experiments show that GPT-3.5-turbo's performance varies by up to 40% in a code
    translation task depending on the prompt template, while larger models like GPT-4
    are more robust to these variations. Our analysis highlights the need to reconsider
    the use of fixed prompt templates, as different formats can significantly affect
    model performance.
  link: https://arxiv.org/abs/2411.10541
  image: /portfolio/does_prompt_formatting_have.png
  imageAlt:
    An example to demonstrate how prompt formatting impacts GPT-3.5-turbo-16k-0613
    model's performance based on our experiments on multiple choice questions related
    to international law from the MMLU benchmark
  authors:
    - Jia He
    - Mukund Rungta
    - David Koleczek
    - Arshdeep Sekhon
    - Franklin X Wang
    - Sadid Hasan

